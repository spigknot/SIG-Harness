# SIG Harness ACP overlay: same provider route as the Web profile.
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: muse-spark-1.3-contributor
            name: Muse Spark 1.3 Contributor
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
        apiKeyEnv: OPENCODE_GO_API_KEY
- id: acp
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
