# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: queue
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      opencode-go:
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
          - id: glm-5.3-flash
            name: GLM-5.3-Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
              - image
          - id: muse-spark-1.3-contributor
            name: Muse Spark 1.3 Contributor
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
        apiKeyEnv: OPENCODE_GO_API_KEY
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
# The in-app folder picker opens at the shared projects root instead of $HOME.
- id: directory-picker
  name: "@deepseek-ai/dsh-host-directory-picker-auto"
  config:
    startDirectory: /storage/emulated/0/Projetos

# Aba "Voz" nas Configurações do DSH (plugin local em node_modules).
- insert:
    - id: dsh-web-sig-voice
      name: 'dsh-web-sig-voice'

# Plugin local do SIG Harness.
- insert:
    - id: dsh-web-sig-find
      name: 'dsh-web-sig-find'

# Busca full-text no histórico: índice FTS5 do próprio DSH, aberto na primeira busca.
- id: session-query-sqlite
  config:
    path: /data/data/com.termux/files/home/.dsh/session-search.db
    openAt: first-search

# Fora do ar: o provedor DeepSeek criado pelo login (duplicava o manual) e a
# superfície de conta — entrada de login na barra lateral e seção "Account".
# O provedor manual (deepseek-official, via API key) continua disponível.
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-account
  disabled: true

# Botão "Reiniciar harness" no rodapé da barra lateral.
- insert:
    - id: dsh-web-sig-restart
      name: 'dsh-web-sig-restart'

# Plugin local do SIG Harness.
- insert:
    - id: dsh-web-search-tavily
      name: 'dsh-web-search-tavily'

# Busca na web: Tavily é o provedor padrão do seam ctx.web.
- id: web
  config:
    searchProvider: tavily
    fetchProvider: http

# Plugin local do SIG Harness.
- insert:
    - id: dsh-web-sig-search-tavily
      name: 'dsh-web-sig-search-tavily'
